<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fælles budget - Personlige grænser</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    /* ------------------------------------------------------------------ */
    /*  Standardkategorier — kan redigeres frit inde i appen               */
    /* ------------------------------------------------------------------ */

    const slug = (s) =>
      s
        .toLowerCase()
        .replace(/æ/g, "ae")
        .replace(/ø/g, "oe")
        .replace(/å/g, "aa")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");

    const SEED = [
      ["Bolig", ["Husleje eller boliglån", "El", "Vand", "Varme", "Internet og TV", "Indboforsikring", "Vedligehold"]],
      ["Transport", ["Bil eller leasing", "Bilforsikring og ejerafgift", "Brændstof og opladning", "Service og reparation", "Offentlig transport", "Parkering"]],
      ["Mad og dagligvarer", ["Dagligvarer", "Restaurant og takeaway", "Café og bar", "Frokost på arbejdet"]],
      ["Abonnementer", ["Mobil", "Streaming og medier", "Aviser og magasiner", "Apps og software", "Medlemskaber"]],
      ["Forsikring og sundhed", ["Ulykkes- og livsforsikring", "Sundhedsforsikring", "Læge, tandlæge og medicin", "Briller og linser", "Fitness"]],
      ["Personligt", ["Tøj og shopping", "Frisør og personlig pleje", "Fritid og hobby", "Bøger, spil og kultur", "Gaver"]],
      ["Børn og familie", ["Daginstitution og SFO", "Børnetøj og udstyr", "Fritidsaktiviteter", "Børneopsparing"]],
      ["Kæledyr", ["Foder og udstyr", "Dyrlæge og forsikring"]],
      ["Rejser og ferie", ["Rejser og ophold", "Forbrug på ferien", "Ferieopsparing"]],
      ["Opsparing og gæld", ["Opsparing", "Pension", "Investering", "Afdrag på lån", "SU-lån og studiegæld"]],
      ["Andet", ["Donationer", "Uforudsete udgifter", "Andet"]],
    ];

    const DEFAULT_CATS = SEED.map(([name, subs]) => ({
      id: "g-" + slug(name),
      name,
      subs: subs.map((s) => ({ id: "s-" + slug(s), name: s })),
    }));

    const LEGACY = {
      Bolig: "Husleje eller boliglån",
      Mad: "Dagligvarer",
      Shopping: "Tøj og shopping",
      Transport: "Offentlig transport",
      Abonnementer: "Streaming og medier",
      Forsikring: "Indboforsikring",
      Fritid: "Fritid og hobby",
      Restaurant: "Restaurant og takeaway",
      Sundhed: "Læge, tandlæge og medicin",
      Opsparing: "Opsparing",
      Andet: "Andet",
      "El, vand og varme": "El",
      "Bil: afdrag eller leasing": "Bil eller leasing",
      "Bil: forsikring og ejerafgift": "Bilforsikring og ejerafgift",
      "Brændstof eller opladning": "Brændstof og opladning",
      "Service, dæk og reparation": "Service og reparation",
      "Parkering og broafgift": "Parkering",
      "Vedligehold og indretning": "Vedligehold",
      "Ejerudgifter og grundskyld": "Husleje eller boliglån",
      "Fitness og træning": "Fitness",
      "Flybilletter og ophold": "Rejser og ophold",
      Cykel: "Offentlig transport",
    };

    /* ------------------------------------------------------------------ */

    const KEY = "budget-dashboard";
    const uid = () => Math.random().toString(36).slice(2, 9);
    const BUCKET = { a: "mine", b: "theirs", j: "shared" };

    const START = {
      names: { a: "Dig", b: "Kæreste" },
      incomes: { a: 0, b: 0 },
      split: "even",
      cats: DEFAULT_CATS,
      shared: [],
      mine: [],
      theirs: [],
      limits: [],
      settlements: [],
    };

    const kr = (n) =>
      new Intl.NumberFormat("da-DK", { maximumFractionDigits: 0 }).format(Math.round(n || 0)) + " kr";

    const dayLabel = (iso) => {
      const d = new Date(iso + "T00:00:00");
      return isNaN(d) ? "" : d.toLocaleDateString("da-DK", { day: "numeric", month: "short" });
    };

    const findSub = (cats, id) => {
      for (const g of cats) for (const sub of g.subs) if (sub.id === id) return { sub, group: g };
      return null;
    };

    /* migrering fra tidligere gemte data */
    function migrate(raw) {
      const s = { ...START, ...raw };
      if (!Array.isArray(s.cats) || s.cats.length === 0) s.cats = DEFAULT_CATS;

      const byName = {};
      for (const g of s.cats) for (const sub of g.subs) byName[sub.name] = sub.id;
      const first = s.cats[0].subs[0].id;
      const toId = (c) => {
        if (!c) return first;
        if (byName[c]) return byName[c];
        const legacy = LEGACY[c];
        return (legacy && byName[legacy]) || byName["Andet"] || first;
      };

      for (const b of ["shared", "mine", "theirs"])
        s[b] = (s[b] || []).map((x) => ({
          ...x,
          catId: x.catId && findSub(s.cats, x.catId) ? x.catId : toId(x.cat),
          cat: undefined,
        }));

      const groupByName = {};
      for (const g of s.cats) groupByName[g.name] = g.id;
      s.limits = (s.limits || []).map((l) => {
        const owner = l.owner || "a";
        if (l.target && (findSub(s.cats, l.target.slice(2)) || s.cats.some((g) => g.id === l.target.slice(2))))
          return { ...l, owner };
        const t = l.target || "s:" + (l.cat || "Andet");
        const kind = t.slice(0, 1);
        const name = t.slice(2);
        return {
          ...l,
          owner,
          target: kind === "g" ? "g:" + (groupByName[name] || s.cats[0].id) : "s:" + toId(name),
        };
      });
      return s;
    }

    /* ------------------------------------------------------------------ */
    /*  Byggeklodser                                                       */
    /* ------------------------------------------------------------------ */

    function CatSelect({ cats, value, onChange, className }) {
      return (
        <select className={className} value={value} onChange={(e) => onChange(e.target.value)}>
          {cats.map((g) => (
            <optgroup key={g.id} label={g.name}>
              {g.subs.map((s) => (
                <option key={s.id} value={s.id}>
                  {s.name}
                </option>
              ))}
            </optgroup>
          ))}
        </select>
      );
    }

    function Row({ item, cats, onChange, onDelete, payerNames }) {
      const set = (p) => onChange({ ...item, ...p });
      const cyclePayer = () => {
        const order = ["a", "b", "j"];
        set({ payer: order[(order.indexOf(item.payer) + 1) % 3] });
      };
      return (
        <div className="row">
          <input
            className="cell cell-name"
            value={item.name}
            placeholder="Hvad er det?"
            onChange={(e) => set({ name: e.target.value })}
          />
          <CatSelect cats={cats} className="cell cell-cat" value={item.catId} onChange={(catId) => set({ catId })} />
          {payerNames && (
            <button className={`payer p-${item.payer}`} onClick={cyclePayer} title="Hvem trækker beløbet?">
              <span className="dot" />
              {item.payer === "j" ? "Fælles konto" : payerNames[item.payer]}
            </button>
          )}
          <input
            className="cell cell-amount"
            type="number"
            inputMode="decimal"
            placeholder="0"
            value={item.amount === 0 ? "" : item.amount}
            onChange={(e) => set({ amount: e.target.value === "" ? 0 : Number(e.target.value) })}
          />
          <button className="del" onClick={onDelete} aria-label="Slet linje">
            ×
          </button>
        </div>
      );
    }

    function List({ items, cats, onChange, onAdd, onDelete, payerNames, empty, addLabel }) {
      return (
        <>
          {items.length === 0 ? (
            <p className="empty">{empty}</p>
          ) : (
            items.map((it) => (
              <Row
                key={it.id}
                item={it}
                cats={cats}
                payerNames={payerNames}
                onChange={(next) => onChange(it.id, next)}
                onDelete={() => onDelete(it.id)}
              />
            ))
          )}
          <button className="add" onClick={onAdd}>
            {addLabel}
          </button>
        </>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  App                                                                */
    /* ------------------------------------------------------------------ */

    function Budget() {
      const [d, setD] = useState(START);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [showReset, setShowReset] = useState(false);
      const [editCats, setEditCats] = useState(false);
      const [open, setOpen] = useState({});
      const ready = useRef(false);
      const dirtyUntil = useRef(0);

      useEffect(() => {
        let alive = true;
        (async () => {
          if (!window.storage) {
            if (alive) {
              setLoading(false);
              setError("Delt lagring er ikke tilgængelig her. Tallene forsvinder, når siden lukkes.");
            }
            return;
          }
          let next = START;
          try {
            const r = await window.storage.get(KEY, true);
            if (r && r.value) next = migrate(JSON.parse(r.value));
          } catch (err) {
            if (err && err.message) setError(err.message);
          }
          if (!alive) return;
          setD(next);
          setLoading(false);
          ready.current = true;
        })();
        return () => {
          alive = false;
        };
      }, []);

      useEffect(() => {
        if (!ready.current || !window.storage) return;
        const t = setTimeout(async () => {
          try {
            const ok = await window.storage.set(KEY, JSON.stringify(d), true);
            setError(ok ? "" : "Kunne ikke gemme. Prøv at ændre noget igen.");
          } catch {
            setError("Kunne ikke gemme. Prøv at ændre noget igen.");
          }
        }, 600);
        return () => clearTimeout(t);
      }, [d]);

      useEffect(() => {
        if (!window.storage?.subscribe) return;
        return window.storage.subscribe((value) => {
          // Undgå at en cloud-opdatering overskriver noget, der netop skrives lokalt.
          if (Date.now() < dirtyUntil.current) return;
          try {
            const next = migrate(JSON.parse(value));
            setD(next);
            setError("");
          } catch {
            // Ignorer ugyldige cloud-data; den lokale visning bevares.
          }
        });
      }, []);

      const patch = (fn) => {
        dirtyUntil.current = Date.now() + 1400;
        setD((s) => ({ ...s, ...fn(s) }));
      };

      const listOps = (bucket) => ({
        onChange: (id, next) => patch((s) => ({ [bucket]: s[bucket].map((x) => (x.id === id ? next : x)) })),
        onDelete: (id) => patch((s) => ({ [bucket]: s[bucket].filter((x) => x.id !== id) })),
        onAdd: () =>
          patch((s) => ({
            [bucket]: [
              ...s[bucket],
              {
                id: uid(),
                name: "",
                amount: 0,
                catId: s.cats[0].subs[0]?.id,
                ...(bucket === "shared" ? { payer: "j" } : {}),
              },
            ],
          })),
      });

      /* ---------- kategoristyring ---------- */
      const countUses = (ids) => [...d.shared, ...d.mine, ...d.theirs].filter((x) => ids.includes(x.catId)).length;

      const applyCatRemoval = (nextCats, removedIds) =>
        patch((s) => {
          let cats = nextCats;
          let fallback = cats.flatMap((g) => g.subs)[0];
          if (!fallback) {
            fallback = { id: uid(), name: "Andet" };
            cats = [{ id: uid(), name: "Andet", subs: [fallback] }];
          }
          const fix = (arr) => arr.map((x) => (removedIds.includes(x.catId) ? { ...x, catId: fallback.id } : x));
          return {
            cats,
            shared: fix(s.shared),
            mine: fix(s.mine),
            theirs: fix(s.theirs),
            limits: s.limits.filter((l) => !removedIds.includes(l.target.slice(2))),
          };
        });

      const addGroup = () =>
        patch((s) => ({
          cats: [...s.cats, { id: uid(), name: "Ny kategori", subs: [{ id: uid(), name: "Ny underkategori" }] }],
        }));

      const addSub = (gid) =>
        patch((s) => ({
          cats: s.cats.map((g) => (g.id === gid ? { ...g, subs: [...g.subs, { id: uid(), name: "Ny underkategori" }] } : g)),
        }));

      const renameGroup = (gid, name) => patch((s) => ({ cats: s.cats.map((g) => (g.id === gid ? { ...g, name } : g)) }));

      const renameSub = (gid, sid, name) =>
        patch((s) => ({
          cats: s.cats.map((g) =>
            g.id === gid ? { ...g, subs: g.subs.map((x) => (x.id === sid ? { ...x, name } : x)) } : g
          ),
        }));

      const deleteSub = (gid, sid) => {
        const n = countUses([sid]);
        if (n > 0 && !window.confirm(`${n} ${n === 1 ? "udgift" : "udgifter"} flyttes til den første kategori på listen. Fortsæt?`))
          return;
        const nextCats = d.cats
          .map((g) => (g.id === gid ? { ...g, subs: g.subs.filter((x) => x.id !== sid) } : g))
          .filter((g) => g.subs.length > 0);
        applyCatRemoval(nextCats, [sid, ...(nextCats.some((g) => g.id === gid) ? [] : [gid])]);
      };

      const deleteGroup = (gid) => {
        const g = d.cats.find((x) => x.id === gid);
        const ids = g.subs.map((s) => s.id);
        const n = countUses(ids);
        if (
          !window.confirm(
            n > 0
              ? `"${g.name}" slettes, og ${n} ${n === 1 ? "udgift flyttes" : "udgifter flyttes"} til den første kategori på listen. Fortsæt?`
              : `Slet "${g.name}"?`
          )
        )
          return;
        applyCatRemoval(d.cats.filter((x) => x.id !== gid), [...ids, gid]);
      };

      /* ---------- beregninger ---------- */
      const m = useMemo(() => {
        const sum = (arr) => arr.reduce((s, x) => s + (+x.amount || 0), 0);
        const sharedTotal = sum(d.shared);
        const mineTotal = sum(d.mine);
        const theirsTotal = sum(d.theirs);
        const total = sharedTotal + mineTotal + theirsTotal;

        const incA = +d.incomes.a || 0;
        const incB = +d.incomes.b || 0;
        const income = incA + incB;
        const shareA = d.split === "income" && income > 0 ? incA / income : 0.5;
        const shareB = 1 - shareA;

        const paid = (p) => d.shared.filter((x) => x.payer === p).reduce((s, x) => s + (+x.amount || 0), 0);
        const paidA = paid("a");
        const paidB = paid("b");
        const pool = paidA + paidB;

        let balanceA = paidA - shareA * pool;
        for (const s of d.settlements) balanceA += s.from === "a" ? s.amount : -s.amount;

        const leftA = incA - mineTotal - shareA * sharedTotal;
        const leftB = incB - theirsTotal - shareB * sharedTotal;

        const buckets = { j: d.shared, a: d.mine, b: d.theirs };
        const groups = d.cats
          .map((g) => {
            const ids = g.subs.map((s) => s.id);
            const parts = { j: 0, a: 0, b: 0 };
            const subTotals = {};
            for (const [k, arr] of Object.entries(buckets))
              for (const x of arr) {
                if (!ids.includes(x.catId)) continue;
                const v = +x.amount || 0;
                parts[k] += v;
                subTotals[x.catId] = (subTotals[x.catId] || 0) + v;
              }
            const tot = parts.j + parts.a + parts.b;
            return {
              id: g.id,
              name: g.name,
              total: tot,
              parts,
              subs: g.subs
                .map((s) => [s.name, subTotals[s.id] || 0])
                .filter(([, v]) => v > 0)
                .sort((p, q) => q[1] - p[1]),
            };
          })
          .filter((g) => g.total > 0)
          .sort((p, q) => q.total - p.total);
        const groupMax = groups.length ? groups[0].total : 1;

        const limits = d.limits.map((l) => {
          const kind = l.target.slice(0, 1);
          const id = l.target.slice(2);
          const group = d.cats.find((g) => g.id === id);
          const hit = findSub(d.cats, id);
          const ids = kind === "g" ? (group ? group.subs.map((s) => s.id) : []) : [id];
          const spent = d[BUCKET[l.owner]].filter((x) => ids.includes(x.catId)).reduce((s, x) => s + (+x.amount || 0), 0);
          const cap = +l.amount || 0;
          return {
            ...l,
            label: kind === "g" ? (group ? group.name : "—") : hit ? hit.sub.name : "—",
            spent,
            cap,
            rest: cap - spent,
            over: cap > 0 && spent > cap,
          };
        });
        const byOwner = (o) => limits.filter((l) => l.owner === o);

        return {
          sharedTotal, mineTotal, theirsTotal, total,
          incA, incB, income, shareA, shareB,
          pool, balanceA, leftA, leftB,
          groups, groupMax,
          limits, byOwner,
        };
      }, [d]);

      const settle = () => {
        const amount = Math.round(Math.abs(m.balanceA));
        if (amount < 1) return;
        patch((s) => ({
          settlements: [
            ...s.settlements,
            { id: uid(), amount, from: m.balanceA > 0 ? "b" : "a", date: new Date().toISOString().slice(0, 10) },
          ],
        }));
      };

      const addLimit = (owner) =>
        patch((s) => ({
          limits: [...s.limits, { id: uid(), owner, target: "s:" + s.cats[0].subs[0].id, amount: 0 }],
        }));

      const wipe = async () => {
        if (!window.confirm("Slet alle tal? Det kan ikke fortrydes.")) return;
        try {
          await window.storage.delete(KEY, true);
        } catch {
          /* ingen gemte tal at slette */
        }
        setD(START);
        setShowReset(false);
      };

      const N = d.names;
      const debtor = m.balanceA > 0.5 ? "b" : m.balanceA < -0.5 ? "a" : null;
      const tilt = m.pool > 0 ? Math.max(-0.42, Math.min(0.42, (m.balanceA / (m.pool / 2)) * 0.42)) : 0;
      const beamColor = debtor === "b" ? "var(--a)" : debtor === "a" ? "var(--b)" : "var(--muted)";

      /* ---------- personkort ---------- */
      const Person = ({ p }) => {
        const inc = p === "a" ? m.incA : m.incB;
        const own = p === "a" ? m.mineTotal : m.theirsTotal;
        const share = (p === "a" ? m.shareA : m.shareB) * m.sharedTotal;
        const left = p === "a" ? m.leftA : m.leftB;
        const used = inc > 0 ? Math.min(1, (own + share) / inc) : 0;
        const mine = m.byOwner(p);
        const over = mine.filter((l) => l.over).length;
        return (
          <div className="card person">
            <div className="p-head">
              <span className="swatch" style={{ background: `var(--${p})` }} />
              <input
                className="p-name"
                value={N[p]}
                onChange={(e) => patch((s) => ({ names: { ...s.names, [p]: e.target.value } }))}
              />
            </div>
            <div className="p-line">
              <span>Indtægt</span>
              <input
                className="cell cell-amount"
                type="number"
                inputMode="decimal"
                placeholder="0"
                value={inc === 0 ? "" : inc}
                onChange={(e) =>
                  patch((s) => ({
                    incomes: { ...s.incomes, [p]: e.target.value === "" ? 0 : Number(e.target.value) },
                  }))
                }
              />
            </div>
            <div className="p-line quiet">
              <span>Egne udgifter</span>
              <b>− {kr(own)}</b>
            </div>
            <div className="p-line quiet">
              <span>Andel af fælles ({Math.round((p === "a" ? m.shareA : m.shareB) * 100)}%)</span>
              <b>− {kr(share)}</b>
            </div>
            <div className="p-bar">
              <i style={{ width: `${used * 100}%`, background: `var(--${p})` }} />
            </div>
            <div className="p-left">
              <span>Tilbage</span>
              <strong className={left < 0 ? "neg" : ""}>{kr(left)}</strong>
            </div>
            {mine.length > 0 && (
              <div className={`p-note ${over ? "neg" : ""}`}>
                {over === 0
                  ? `Alle ${mine.length === 1 ? "grænsen holder" : "grænser holder"}`
                  : `${over} af ${mine.length} grænser er overskredet`}
              </div>
            )}
          </div>
        );
      };

      /* ---------- grænser ---------- */
      const Limit = ({ l }) => {
        const fill = l.cap > 0 ? Math.min(1, l.spent / l.cap) : 0;
        const color = l.over ? "var(--warn)" : `var(--${l.owner})`;
        const set = (p) => patch((s) => ({ limits: s.limits.map((x) => (x.id === l.id ? { ...x, ...p } : x)) }));
        return (
          <div className="limit">
            <div className="limit-top">
              <select className="cell cell-target" value={l.target} onChange={(e) => set({ target: e.target.value })}>
                <optgroup label="Hele kategorien">
                  {d.cats.map((g) => (
                    <option key={g.id} value={"g:" + g.id}>
                      {g.name} — alt
                    </option>
                  ))}
                </optgroup>
                {d.cats.map((g) => (
                  <optgroup key={g.id} label={g.name}>
                    {g.subs.map((s) => (
                      <option key={s.id} value={"s:" + s.id}>
                        {s.name}
                      </option>
                    ))}
                  </optgroup>
                ))}
              </select>
              <span className="maxlabel">maks</span>
              <input
                className="cell cell-amount"
                type="number"
                inputMode="decimal"
                placeholder="0"
                value={l.amount === 0 ? "" : l.amount}
                onChange={(e) => set({ amount: e.target.value === "" ? 0 : Number(e.target.value) })}
              />
              <button
                className="del"
                onClick={() => patch((s) => ({ limits: s.limits.filter((x) => x.id !== l.id) }))}
                aria-label="Slet grænse"
              >
                ×
              </button>
            </div>
            <div className="bar limit-bar">
              <i style={{ width: `${fill * 100}%`, background: color }} />
            </div>
            <div className="limit-meta">
              <span>
                {kr(l.spent)} af {kr(l.cap)} brugt
              </span>
              <span className={l.over ? "neg" : ""}>
                {l.cap === 0 ? "Sæt et beløb" : l.over ? `${kr(-l.rest)} over` : `${kr(l.rest)} tilbage`}
              </span>
            </div>
          </div>
        );
      };

      const LimitCard = ({ owner, title, note, empty }) => {
        const list = m.byOwner(owner);
        const over = list.filter((l) => l.over).length;
        return (
          <div className="card">
            <div className="head">
              <div>
                <h2 style={{ display: "flex", alignItems: "center", gap: 9 }}>

                      Slet alle tal

                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  Storage implementation — Supabase sync + local fallback           */
    /* ------------------------------------------------------------------ */

    // 1) Create a Supabase project.
    // 2) Put your project URL and anon key below.
    // 3) Use the same BUDGET_ID on every device that should share data.
    const SUPABASE_URL = "https://kjzkcnjvgmmycpebxgez.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Igci9zcJYexX1WfSZVQXQg_aOfS9CbI";
    const BUDGET_ID = "vores-budget";

    const cloudEnabled =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("PASTE_") &&
      SUPABASE_PUBLISHABLE_KEY &&
      !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");

    const supabaseClient = cloudEnabled
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;

    const localKey = (key) => `${BUDGET_ID}:${key}`;
    const accessKeyName = `budget-access:${BUDGET_ID}`;

    const getAccessToken = () => {
      if (!supabaseClient) return null;
      let token = localStorage.getItem(accessKeyName);
      if (!token) {
        token = window.prompt(
          "Indtast den fælles budgetkode. Brug den samme kode på alle enheder, der skal dele budgettet."
        );
        if (token) localStorage.setItem(accessKeyName, token.trim());
      }
      return token ? token.trim() : null;
    };

    let lastCloudValue = null;

    async function readCloudValue() {
      if (!supabaseClient) return null;
      const accessToken = getAccessToken();
      if (!accessToken) throw new Error("Der mangler en fælles budgetkode.");

      const { data, error } = await supabaseClient.rpc("get_shared_budget", {
        p_budget_id: BUDGET_ID,
        p_access_token: accessToken,
      });

      if (error) {
        localStorage.removeItem(accessKeyName);
        throw new Error("Kunne ikke åbne det fælles budget. Kontrollér budgetkoden og prøv igen.");
      }
      return data ? JSON.stringify(data) : null;
    }

    window.storage = {
      async get(key, unused) {
        if (supabaseClient) {
          const value = await readCloudValue();
          if (value) {
            lastCloudValue = value;
            return { value };
          }
        }

        try {
          return { value: localStorage.getItem(localKey(key)) };
        } catch {
          return { value: null };
        }
      },

      async set(key, value, unused) {
        let localOk = true;
        try {
          localStorage.setItem(localKey(key), value);
        } catch {
          localOk = false;
        }

        if (!supabaseClient) return localOk;

        const accessToken = getAccessToken();
        if (!accessToken) return false;

        try {
          const payload = JSON.parse(value);
          const { error } = await supabaseClient.rpc("save_shared_budget", {
            p_budget_id: BUDGET_ID,
            p_access_token: accessToken,
            p_payload: payload,
          });
          if (error) return false;
          lastCloudValue = value;
          return true;
        } catch {
          return false;
        }
      },

      subscribe(onValue) {
        if (!supabaseClient) return () => {};
        let stopped = false;
        let busy = false;

        const check = async () => {
          if (stopped || busy) return;
          busy = true;
          try {
            const value = await readCloudValue();
            if (value && value !== lastCloudValue) {
              lastCloudValue = value;
              onValue(value);
            }
          } catch {
            // Bevar den eksisterende visning ved midlertidige netværksfejl.
          } finally {
            busy = false;
          }
        };

        const timer = setInterval(check, 1500);
        return () => {
          stopped = true;
          clearInterval(timer);
        };
      },

      async list(prefix, unused) {
        return { keys: [] };
      },

      async delete(key, unused) {
        try {
          localStorage.removeItem(localKey(key));
        } catch {}

        if (!supabaseClient) return true;
        const accessToken = getAccessToken();
        if (!accessToken) return false;

        const { error } = await supabaseClient.rpc("delete_shared_budget", {
          p_budget_id: BUDGET_ID,
          p_access_token: accessToken,
        });
        if (!error) lastCloudValue = null;
        return !error;
      }
    };

    /* Render the app */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Budget />);
  </script>
</body>
